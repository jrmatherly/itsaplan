name: Release

# release-please keeps an open "release PR" on main that accumulates the next
# version and CHANGELOG from conventional-commit subjects. Merging that PR tags
# the commit (vX.Y.Z) and publishes a GitHub Release. No manual version bumps.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with the workflow token gets its checks in an
      # approval-required state. One opened with a GitHub App's installation
      # token gets them started. The step is skipped while the variable is
      # unset, and release-please then uses the workflow token.
      - name: 🔑 Create the release App token
        id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: 🚀 Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The deploy target (Coolify) follows the `release` branch, so it points at
  # the released commit. This job is its only writer, which keeps the push a
  # fast-forward; the branch appears with the first published release.
  #
  # It lives in this workflow rather than one triggered by `release: published`,
  # because that event is raised by GITHUB_TOKEN and GITHUB_TOKEN-triggered
  # events do not start workflow runs.
  move-release-branch:
    name: Move the release branch
    needs: release-please
    # release-please tags the commit before the rest of its work and can fail
    # afterwards — for example when it cannot comment on a PR whose
    # conversation is locked. The deploy must not stay behind because of that.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Empty on a push that cut no release; the image job keys off it.
    outputs:
      tag: ${{ steps.move.outputs.tag }}
    steps:
      # `fetch-depth: 0` fetches the tags read below, and the object for the
      # current `release` head — without it git cannot prove the push is a
      # fast-forward and rejects it with `! [rejected] HEAD -> release`.
      - name: 📥 Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Every push to main runs this workflow; the tag is what says a release
      # was cut. Reading it from git keeps the job independent of the outputs of
      # a step that may have failed. `refs/heads/release` is fully qualified
      # because git resolves a bare `release` against the remote, which fails
      # while the branch does not exist yet.
      - name: 🔀 Move the release branch to the released commit
        id: move
        run: |
          tag=$(git tag --points-at HEAD --list 'v*')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release tag on $(git rev-parse --short HEAD), nothing to move."
            exit 0
          fi
          echo "Moving the release branch to $tag."
          git push origin HEAD:refs/heads/release

  # Prebuilt images for self-hosters: `docker compose pull` instead of a build.
  # Chained here for the same reason as the job above — a `release: published`
  # event raised by GITHUB_TOKEN starts no workflow run.
  publish-images:
    name: Publish images
    needs: move-release-branch
    if: ${{ needs.move-release-branch.outputs.tag != '' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      tag: ${{ needs.move-release-branch.outputs.tag }}

  # The chart as an OCI artifact for self-hosters: `helm install oci://…` instead
  # of cloning the repository. Runs beside publish-images because the chart it
  # publishes is the one that deploys those images.
  publish-chart:
    name: Publish chart
    needs: move-release-branch
    if: ${{ needs.move-release-branch.outputs.tag != '' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-chart.yml
    with:
      tag: ${{ needs.move-release-branch.outputs.tag }}
